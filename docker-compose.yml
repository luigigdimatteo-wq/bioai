version: '3.8'

services:
  backend:
    build: .
    container_name: bioai-backend
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: always

  frontend:
    build: .
    container_name: bioai-frontend
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - backend
    restart: always
